<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FCP - Facility Management System</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/assets/css/main.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <i class="fas fa-building"></i>
        </div>
        <span class="sidebar-title">Facility MS</span>
      </div>
      
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Main</div>
          <a href="/dashboard/" class="nav-link">
            <i class="fas fa-home"></i>
            <span>Dashboard</span>
          </a>
        </div>
        
        <div class="nav-section">
          <div class="nav-section-title">Management</div>
          <a href="/fcp/" class="nav-link active">
            <i class="fas fa-clipboard-check"></i>
            <span>FCP</span>
          </a>
          <a href="/fnq/" class="nav-link">
            <i class="fas fa-tasks"></i>
            <span>FNQ</span>
          </a>
          <a href="/visitors/" class="nav-link">
            <i class="fas fa-users"></i>
            <span>Visitors</span>
          </a>
          <a href="/gatepass/" class="nav-link">
            <i class="fas fa-id-card"></i>
            <span>Gate Pass</span>
          </a>
        </div>
        
        <div class="nav-section">
          <div class="nav-section-title">Records</div>
          <a href="/history/" class="nav-link">
            <i class="fas fa-history"></i>
            <span>History</span>
          </a>
          <a href="/users/" class="nav-link" data-role="admin,manager">
            <i class="fas fa-user-cog"></i>
            <span>Users</span>
          </a>
        </div>
      </nav>
      
      <div class="sidebar-footer">
        <a href="#" class="nav-link" id="sidebar-logout">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </a>
      </div>
    </aside>
    
    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <button class="header-toggle" id="sidebar-toggle">
            <i class="fas fa-bars"></i>
          </button>
          <h2 class="header-title">FCP Management</h2>
        </div>
        
        <div class="header-right">
          <div class="header-btn" id="notification-btn">
            <i class="fas fa-bell"></i>
            <span class="notification-badge"></span>
          </div>
          
          <div class="user-menu-wrapper">
            <button class="user-menu-toggle" id="user-menu-toggle">
              <div class="user-avatar" id="user-avatar">U</div>
              <div class="user-info">
                <div class="user-name" id="user-name">User</div>
                <div class="user-role" id="user-role-badge">User</div>
              </div>
              <i class="fas fa-chevron-down" style="font-size: 0.75rem; color: var(--text-secondary);"></i>
            </button>
            
            <div class="user-menu" id="user-menu">
              <a href="#" class="user-menu-item">
                <i class="fas fa-user"></i>
                <span>Profile</span>
              </a>
              <a href="#" class="user-menu-item">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
              </a>
              <div class="user-menu-divider"></div>
              <a href="#" class="user-menu-item" id="logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
              </a>
            </div>
          </div>
        </div>
      </header>
      
      <!-- Page Content -->
      <div class="page-content">
        <!-- Page Header -->
        <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <h1 class="page-title">Facility Control Procedures</h1>
            <p class="page-subtitle">Manage and track facility control procedures</p>
          </div>
          <button class="btn btn-primary" id="new-fcp-btn">
            <i class="fas fa-plus"></i>
            <span>New FCP</span>
          </button>
        </div>
        
        <!-- Filters -->
        <div class="card" style="margin-bottom: 1.5rem;">
          <div class="card-body">
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
              <div style="flex: 1; min-width: 200px;">
                <input type="text" class="form-input" id="search-fcp" placeholder="Search FCP...">
              </div>
              <div style="min-width: 150px;">
                <select class="form-input" id="status-filter">
                  <option value="">All Status</option>
                  <option value="pending">Pending</option>
                  <option value="approved">Approved</option>
                  <option value="rejected">Rejected</option>
                  <option value="completed">Completed</option>
                </select>
              </div>
              <div style="min-width: 150px;">
                <select class="form-input" id="priority-filter">
                  <option value="">All Priority</option>
                  <option value="high">High</option>
                  <option value="medium">Medium</option>
                  <option value="low">Low</option>
                </select>
              </div>
              <button class="btn btn-secondary" id="filter-btn">
                <i class="fas fa-filter"></i>
                <span>Filter</span>
              </button>
            </div>
          </div>
        </div>
        
        <!-- FCP List -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">FCP Records</h3>
            <div style="display: flex; gap: 0.5rem;">
              <button class="btn btn-sm btn-secondary">
                <i class="fas fa-download"></i>
                <span>Export</span>
              </button>
            </div>
          </div>
          <div class="card-body">
            <div class="table-wrapper">
              <table class="table">
                <thead>
                  <tr>
                    <th>FCP ID</th>
                    <th>Title</th>
                    <th>Department</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="fcp-table-body">
                  <tr>
                    <td colspan="7" style="text-align: center; padding: 2rem;">
                      <div class="loading-spinner" style="width: 30px; height: 30px;"></div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- New FCP Modal -->
  <div id="fcp-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
    <div style="background: var(--bg-primary); border-radius: var(--radius-lg); width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;">
      <div class="card-header">
        <h3 class="card-title">Create New FCP</h3>
        <button id="close-modal" style="font-size: 1.25rem; color: var(--text-secondary);">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="card-body">
        <form id="fcp-form">
          <div class="form-group">
            <label class="form-label">Title</label>
            <input type="text" class="form-input" name="title" required>
          </div>
          <div class="form-group">
            <label class="form-label">Department</label>
            <select class="form-input" name="department" required>
              <option value="">Select Department</option>
              <option value="security">Security</option>
              <option value="maintenance">Maintenance</option>
              <option value="operations">Operations</option>
              <option value="admin">Administration</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Priority</label>
            <select class="form-input" name="priority" required>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea class="form-input" name="description" rows="4" required></textarea>
          </div>
          <div style="display: flex; gap: 0.75rem; justify-content: flex-end;">
            <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
            <button type="submit" class="btn btn-primary">Create FCP</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Firebase Config -->
  <script src="/assets/js/firebase-config.js"></script>
  
  <!-- Auth Guard -->
  <script src="/assets/js/auth-guard.js"></script>
  
  <!-- Role Guard -->
  <script src="/assets/js/role-guard.js"></script>
  
  <!-- Main JS -->
  <script src="/assets/js/main.js"></script>
  
  <script>
    (function() {
      'use strict';
      
      // Update user info
      function updateUserInfo(user) {
        if (!user) return;
        
        const userName = document.getElementById('user-name');
        const userAvatar = document.getElementById('user-avatar');
        
        if (userName) {
          userName.textContent = user.displayName || user.email.split('@')[0];
        }
        
        if (userAvatar) {
          const initial = (user.displayName || user.email).charAt(0).toUpperCase();
          userAvatar.textContent = initial;
        }
      }
      
      // Load FCP records
      async function loadFCPRecords() {
        const tbody = document.getElementById('fcp-table-body');
        
        try {
          const db = firebase.firestore();
          const snapshot = await db.collection('fcp')
            .orderBy('createdAt', 'desc')
            .get();
          
          if (snapshot.empty) {
            tbody.innerHTML = `
              <tr>
                <td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-secondary);">
                  No FCP records found
                </td>
              </tr>
            `;
            return;
          }
          
          tbody.innerHTML = snapshot.docs.map(doc => {
            const data = doc.data();
            const id = doc.id;
            
            let priorityClass = 'badge-info';
            if (data.priority === 'high') priorityClass = 'badge-danger';
            if (data.priority === 'medium') priorityClass = 'badge-warning';
            if (data.priority === 'low') priorityClass = 'badge-success';
            
            let statusClass = 'badge-info';
            if (data.status === 'approved' || data.status === 'completed') statusClass = 'badge-success';
            if (data.status === 'pending') statusClass = 'badge-warning';
            if (data.status === 'rejected') statusClass = 'badge-danger';
            
            const created = data.createdAt ? data.createdAt.toDate().toLocaleDateString() : 'N/A';
            
            return `
              <tr>
                <td><strong>#${id.slice(-6).toUpperCase()}</strong></td>
                <td>${data.title || 'Untitled'}</td>
                <td>${data.department || 'N/A'}</td>
                <td><span class="badge ${priorityClass}">${data.priority || 'N/A'}</span></td>
                <td><span class="badge ${statusClass}">${data.status || 'N/A'}</span></td>
                <td>${created}</td>
                <td>
                  <button class="btn btn-sm btn-secondary" onclick="viewFCP('${id}')">
                    <i class="fas fa-eye"></i>
                  </button>
                  <button class="btn btn-sm btn-primary" onclick="editFCP('${id}')">
                    <i class="fas fa-edit"></i>
                  </button>
                </td>
              </tr>
            `;
          }).join('');
          
        } catch (error) {
          console.error('Error loading FCP:', error);
          // Show demo data
          tbody.innerHTML = `
            <tr>
              <td><strong>#FCP001</strong></td>
              <td>Security Protocol Update</td>
              <td>Security</td>
              <td><span class="badge badge-danger">High</span></td>
              <td><span class="badge badge-warning">Pending</span></td>
              <td>2024-01-15</td>
              <td>
                <button class="btn btn-sm btn-secondary"><i class="fas fa-eye"></i></button>
                <button class="btn btn-sm btn-primary"><i class="fas fa-edit"></i></button>
              </td>
            </tr>
            <tr>
              <td><strong>#FCP002</strong></td>
              <td>Maintenance Schedule Review</td>
              <td>Maintenance</td>
              <td><span class="badge badge-warning">Medium</span></td>
              <td><span class="badge badge-success">Approved</span></td>
              <td>2024-01-14</td>
              <td>
                <button class="btn btn-sm btn-secondary"><i class="fas fa-eye"></i></button>
                <button class="btn btn-sm btn-primary"><i class="fas fa-edit"></i></button>
              </td>
            </tr>
            <tr>
              <td><strong>#FCP003</strong></td>
              <td>Access Control Audit</td>
              <td>Operations</td>
              <td><span class="badge badge-success">Low</span></td>
              <td><span class="badge badge-success">Completed</span></td>
              <td>2024-01-13</td>
              <td>
                <button class="btn btn-sm btn-secondary"><i class="fas fa-eye"></i></button>
                <button class="btn btn-sm btn-primary"><i class="fas fa-edit"></i></button>
              </td>
            </tr>
          `;
        }
      }
      
      // Modal functionality
      const modal = document.getElementById('fcp-modal');
      const newFcpBtn = document.getElementById('new-fcp-btn');
      const closeModalBtn = document.getElementById('close-modal');
      const cancelBtn = document.getElementById('cancel-btn');
      const fcpForm = document.getElementById('fcp-form');
      
      newFcpBtn.addEventListener('click', () => {
        modal.style.display = 'flex';
      });
      
      closeModalBtn.addEventListener('click', () => {
        modal.style.display = 'none';
      });
      
      cancelBtn.addEventListener('click', () => {
        modal.style.display = 'none';
      });
      
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.style.display = 'none';
        }
      });
      
      // Form submission
      fcpForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData(fcpForm);
        const data = {
          title: formData.get('title'),
          department: formData.get('department'),
          priority: formData.get('priority'),
          description: formData.get('description'),
          status: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdBy: firebase.auth().currentUser?.uid || 'unknown'
        };
        
        try {
          const db = firebase.firestore();
          await db.collection('fcp').add(data);
          
          alert('FCP created successfully!');
          modal.style.display = 'none';
          fcpForm.reset();
          loadFCPRecords();
        } catch (error) {
          console.error('Error creating FCP:', error);
          alert('Demo mode: FCP would be created in production');
          modal.style.display = 'none';
          fcpForm.reset();
        }
      });
      
      // Global functions for view/edit
      window.viewFCP = function(id) {
        alert('View FCP: ' + id);
      };
      
      window.editFCP = function(id) {
        alert('Edit FCP: ' + id);
      };
      
      // Initialize
      document.addEventListener('auth:verified', (event) => {
        updateUserInfo(event.detail.user);
        loadFCPRecords();
      });
      
      // Demo mode fallback
      if (firebaseConfig.apiKey === 'YOUR_API_KEY') {
        const demoUser = JSON.parse(sessionStorage.getItem('demoUser') || '{}');
        if (demoUser.email) {
          updateUserInfo(demoUser);
          loadFCPRecords();
        }
      }
    })();
  </script>
</body>
</html>
