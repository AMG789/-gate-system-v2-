<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Facility Management System</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/assets/css/main.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <i class="fas fa-building"></i>
        </div>
        <h1 class="login-title">Welcome Back</h1>
        <p class="login-subtitle">Sign in to access the Facility Management System</p>
      </div>
      
      <form class="login-form" id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="Enter your email"
            required
            autocomplete="email"
          >
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
        </div>
        
        <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
          <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; cursor: pointer;">
            <input type="checkbox" id="remember-me" style="cursor: pointer;">
            Remember me
          </label>
          <a href="#" id="forgot-password" style="font-size: 0.875rem; color: var(--primary-color);">Forgot password?</a>
        </div>
        
        <button type="submit" class="btn btn-primary login-btn" id="login-btn">
          <i class="fas fa-sign-in-alt"></i>
          <span>Sign In</span>
        </button>
      </form>
      
      <div class="login-footer">
        <p>Don't have an account? Contact your administrator</p>
      </div>
    </div>
  </div>

  <!-- Firebase Config -->
  <script src="/assets/js/firebase-config.js"></script>
  
  <!-- Auth Guard (for redirecting logged-in users) -->
  <script src="/assets/js/auth-guard.js"></script>
  
  <script>
    (function() {
      'use strict';
      
      const loginForm = document.getElementById('login-form');
      const loginBtn = document.getElementById('login-btn');
      const forgotPasswordLink = document.getElementById('forgot-password');
      
      // Handle login form submission
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const rememberMe = document.getElementById('remember-me').checked;
        
        // Show loading state
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Signing in...</span>';
        
        try {
          // Set persistence based on remember me
          const persistence = rememberMe 
            ? firebase.auth.Auth.Persistence.LOCAL 
            : firebase.auth.Auth.Persistence.SESSION;
          
          await firebase.auth().setPersistence(persistence);
          
          // Sign in
          const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
          const user = userCredential.user;
          
          console.log('Login successful:', user.email);
          
          // Get redirect URL from query params
          const urlParams = new URLSearchParams(window.location.search);
          const redirectUrl = urlParams.get('redirect') || '/dashboard/';
          
          // Redirect to dashboard or requested page
          window.location.href = decodeURIComponent(redirectUrl);
          
        } catch (error) {
          console.error('Login error:', error);
          
          // Show error message
          let errorMessage = 'Login failed. Please try again.';
          
          switch (error.code) {
            case 'auth/invalid-email':
              errorMessage = 'Invalid email address.';
              break;
            case 'auth/user-disabled':
              errorMessage = 'This account has been disabled.';
              break;
            case 'auth/user-not-found':
              errorMessage = 'No account found with this email.';
              break;
            case 'auth/wrong-password':
              errorMessage = 'Incorrect password.';
              break;
            case 'auth/too-many-requests':
              errorMessage = 'Too many failed attempts. Please try again later.';
              break;
          }
          
          alert(errorMessage);
          
          // Reset button
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Sign In</span>';
        }
      });
      
      // Handle forgot password
      forgotPasswordLink.addEventListener('click', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        
        if (!email) {
          alert('Please enter your email address first.');
          document.getElementById('email').focus();
          return;
        }
        
        try {
          await firebase.auth().sendPasswordResetEmail(email);
          alert('Password reset email sent. Please check your inbox.');
        } catch (error) {
          console.error('Password reset error:', error);
          alert('Failed to send password reset email. Please try again.');
        }
      });
      
      // Check if Firebase is properly configured
      if (firebaseConfig.apiKey === 'YOUR_API_KEY') {
        console.warn('Firebase not configured. Please update firebase-config.js with your actual Firebase credentials.');
        
        // For demo purposes, allow login with any credentials
        loginForm.addEventListener('submit', (e) => {
          e.preventDefault();
          
          const email = document.getElementById('email').value.trim();
          
          // Demo login - store user in session
          sessionStorage.setItem('demoUser', JSON.stringify({
            email: email,
            uid: 'demo-user-id',
            displayName: email.split('@')[0]
          }));
          
          alert('Demo mode: Logging in without Firebase. Please configure Firebase for production use.');
          window.location.href = '/dashboard/';
        });
      }
    })();
  </script>
</body>
</html>
