<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - Gate Management System</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <link rel="stylesheet" href="/assets/css/main.css">
    <style>
        /* Additional Professional Styles */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .stat-card h4 {
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        
        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
        }
        
        .stat-card.fcp { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .stat-card.fnq { background: linear-gradient(135deg, #fc4a1a 0%, #f7b733 100%); }
        .stat-card.visitors { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .stat-card.gatepass { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        
        .export-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        .btn-excel {
            background: #217346;
            color: white;
        }
        
        .btn-excel:hover {
            background: #1e623c;
        }
        
        .btn-pdf {
            background: #dc3545;
            color: white;
        }
        
        .btn-pdf:hover {
            background: #c82333;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .results-count {
            font-size: 16px;
            color: #2c3e50;
            font-weight: 600;
        }
        
        .filter-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        .filter-tag {
            background: #e3f2fd;
            color: #1976d2;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .filter-tag .remove {
            cursor: pointer;
            font-weight: bold;
        }
        
        .data-table {
            max-height: 500px;
            overflow-y: auto;
        }
        
        .data-table th {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .loading-overlay.active {
            display: flex;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div id="dashboard">
        <div class="header">
            <div class="header-content">
                <div class="header-left">
                    <div class="header-logo">🚛</div>
                    <div class="datetime-box">
                        <div class="date" id="currentDate"></div>
                        <div class="time" id="currentTime"></div>
                    </div>
                </div>
                <div class="header-right">
                    <span id="connectionStatus" class="connection-status offline">OFFLINE</span>
                    <span id="currentUser"></span>
                    <span id="adminBadge" class="admin-badge hidden">ADMIN</span>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="nav-tabs">
                <a href="/fcp/" class="nav-tab">FCP</a>
                <a href="/fnq/" class="nav-tab">FNQ</a>
                <a href="/visitors/" class="nav-tab">VISITORS</a>
                <a href="/gatepass/" class="nav-tab">GATE PASS</a>
                <a href="/members/" class="nav-tab">MEMBERS</a>
                <a href="/history/" class="nav-tab active">HISTORY</a>
                <a href="/users/" class="nav-tab hidden" id="usersTab">USERS</a>
            </div>

            <!-- History Section -->
            <div id="historySection">
                <!-- Statistics Cards -->
                <div class="stats-cards" id="statsCards" style="display: none;">
                    <div class="stat-card fcp">
                        <h4>FCP Records</h4>
                        <div class="number" id="fcpCount">0</div>
                    </div>
                    <div class="stat-card fnq">
                        <h4>FNQ Records</h4>
                        <div class="number" id="fnqCount">0</div>
                    </div>
                    <div class="stat-card visitors">
                        <h4>Visitors</h4>
                        <div class="number" id="visitorsCount">0</div>
                    </div>
                    <div class="stat-card gatepass">
                        <h4>Gate Pass</h4>
                        <div class="number" id="gatepassCount">0</div>
                    </div>
                </div>

                <div class="card">
                    <h2>🔍 Advanced History Search</h2>
                    <div class="history-filter">
                        <div class="form-group">
                            <label>Department</label>
                            <select id="historyDept">
                                <option value="all">All Departments</option>
                                <option value="fcp">FCP</option>
                                <option value="fnq">FNQ</option>
                                <option value="visitors">Visitors</option>
                                <option value="gatepass">Gate Pass</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>From Date</label>
                            <input type="date" id="historyFromDate">
                        </div>
                        <div class="form-group">
                            <label>From Time</label>
                            <input type="time" id="historyFromTime" value="00:00">
                        </div>
                        <div class="form-group">
                            <label>To Date</label>
                            <input type="date" id="historyToDate">
                        </div>
                        <div class="form-group">
                            <label>To Time</label>
                            <input type="time" id="historyToTime" value="23:59">
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <select id="historyStatus">
                                <option value="all">All Status</option>
                                <option value="inside">Inside</option>
                                <option value="completed">Completed</option>
                                <option value="out">Out</option>
                                <option value="returned">Returned</option>
                            </select>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="searchHistory()">
                            🔍 Find Records
                        </button>
                        <button class="btn btn-secondary" onclick="clearFilters()">
                            🔄 Clear Filters
                        </button>
                    </div>
                </div>

                <div class="card" id="historyResults" style="display: none;">
                    <div class="results-header">
                        <h2>📊 Search Results</h2>
                        <div class="results-count" id="resultsCount">0 records found</div>
                    </div>
                    
                    <div class="filter-tags" id="filterTags"></div>
                    
                    <div class="data-table">
                        <div class="table-container" id="historyResultsContainer"></div>
                    </div>
                    
                    <div class="export-options">
                        <button class="btn btn-excel" onclick="exportToExcelFile()">
                            📥 Export to Excel
                        </button>
                        <button class="btn btn-pdf" onclick="printHistoryResults()">
                            🖨️ Print Report
                        </button>
                        <button class="btn btn-warning" onclick="exportDailyReport()">
                            📅 Export Daily Report
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/firebase-config.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/excel-export.js"></script>
    <script>
        let currentSearchResults = [];
        let currentFilters = {};

        // Check auth state
        checkAuth((loggedIn) => {
            if (!loggedIn) {
                window.location.href = '/index.html';
                return;
            }
            
            document.getElementById('currentUser').textContent = currentUser.email;
            
            if (isAdmin) {
                document.getElementById('adminBadge').classList.remove('hidden');
                document.getElementById('usersTab').classList.remove('hidden');
            }
            
            // Set default dates
            const today = new Date();
            document.getElementById('historyFromDate').value = formatDate(today);
            document.getElementById('historyToDate').value = formatDate(today);
        });

        // Show/Hide loading
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('active');
        }
        
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        // History Functions
        function searchHistory() {
            showLoading();
            
            const dept = document.getElementById('historyDept').value;
            const fromDate = document.getElementById('historyFromDate').value;
            const fromTime = document.getElementById('historyFromTime').value;
            const toDate = document.getElementById('historyToDate').value;
            const toTime = document.getElementById('historyToTime').value;
            const status = document.getElementById('historyStatus').value;
            
            if (!fromDate || !toDate) {
                hideLoading();
                alert('Please select date range!');
                return;
            }
            
            // Save filters
            currentFilters = { dept, fromDate, fromTime, toDate, toTime, status };
            
            const types = dept === 'all' ? ['fcp', 'fnq', 'visitors', 'gatepass'] : [dept];
            let allResults = [];
            
            // Get data from both current and history
            types.forEach(type => {
                // Current day data
                const currentData = getTodayData(type);
                currentData.forEach(item => {
                    item.type = type;
                    item.source = 'current';
                });
                allResults = allResults.concat(currentData);
                
                // Historical data
                const from = new Date(fromDate);
                const to = new Date(toDate);
                for (let d = new Date(from); d <= to; d.setDate(d.getDate() + 1)) {
                    const dateStr = formatDate(d);
                    if (dateStr !== formatDate(new Date())) {
                        const histData = getHistoryData(type, dateStr);
                        histData.forEach(item => {
                            item.type = type;
                            item.source = 'history';
                            item.date = dateStr;
                        });
                        allResults = allResults.concat(histData);
                    }
                }
            });
            
            // Filter by time
            allResults = allResults.filter(item => {
                const itemTime = item.timeIn || item.timeOut || item.issueTime || '00:00';
                return itemTime >= fromTime && itemTime <= toTime;
            });
            
            // Filter by status
            if (status !== 'all') {
                allResults = allResults.filter(item => item.status === status);
            }
            
            currentSearchResults = allResults;
            
            setTimeout(() => {
                hideLoading();
                displayHistoryResults(allResults);
                updateStats(allResults);
                displayFilterTags();
            }, 500);
        }
        
        function updateStats(results) {
            document.getElementById('fcpCount').textContent = results.filter(r => r.type === 'fcp').length;
            document.getElementById('fnqCount').textContent = results.filter(r => r.type === 'fnq').length;
            document.getElementById('visitorsCount').textContent = results.filter(r => r.type === 'visitors').length;
            document.getElementById('gatepassCount').textContent = results.filter(r => r.type === 'gatepass').length;
            document.getElementById('statsCards').style.display = 'grid';
        }
        
        function displayFilterTags() {
            const tagsContainer = document.getElementById('filterTags');
            const tags = [];
            
            if (currentFilters.dept !== 'all') {
                tags.push(`Department: ${currentFilters.dept.toUpperCase()}`);
            }
            if (currentFilters.status !== 'all') {
                tags.push(`Status: ${currentFilters.status.toUpperCase()}`);
            }
            tags.push(`From: ${currentFilters.fromDate} ${currentFilters.fromTime}`);
            tags.push(`To: ${currentFilters.toDate} ${currentFilters.toTime}`);
            
            tagsContainer.innerHTML = tags.map(tag => 
                `<span class="filter-tag">${tag}</span>`
            ).join('');
        }
        
        function displayHistoryResults(results) {
            const container = document.getElementById('historyResultsContainer');
            const resultsDiv = document.getElementById('historyResults');
            
            document.getElementById('resultsCount').textContent = `${results.length} records found`;
            
            if (results.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #7f8c8d; padding: 30px;">No records found</p>';
                resultsDiv.style.display = 'block';
                return;
            }
            
            let html = '<table><thead><tr>';
            html += '<th>No.</th><th>Type</th><th>Date</th><th>Details</th><th>Time In</th><th>Time Out</th><th>Status</th>';
            html += '</tr></thead><tbody>';
            
            results.forEach((item, index) => {
                let details = '';
                if (item.type === 'fcp') details = `Truck: <strong>${item.truckNo || '-'}</strong>, GP: ${item.gp || '-'}`;
                else if (item.type === 'fnq') details = `Truck: <strong>${item.truckNo || '-'}</strong>, GP: ${item.gp || '-'}${item.driver ? ', Driver: ' + item.driver : ''}`;
                else if (item.type === 'visitors') details = `<strong>${item.name || '-'}</strong> - ${item.company || '-'}${item.destination ? ' → ' + item.destination : ''}`;
                else if (item.type === 'gatepass') details = `GP: <strong>${item.number || '-'}</strong> (${item.department || '-'})`;
                
                const timeIn = item.timeIn || item.issueTime || '-';
                const timeOut = item.timeOut || item.returnTime || '-';
                
                let statusClass = '';
                let statusText = item.status || '-';
                
                if (item.status === 'inside') {
                    statusClass = 'status-in';
                    statusText = 'INSIDE';
                } else if (item.status === 'completed' || item.status === 'returned') {
                    statusClass = 'status-out';
                    statusText = item.status === 'returned' ? 'RETURNED' : 'COMPLETED';
                } else if (item.status === 'out') {
                    statusClass = 'status-pending';
                    statusText = 'OUT';
                }
                
                const date = item.date || formatDate(new Date());
                
                html += `<tr>
                    <td>${index + 1}</td>
                    <td><strong>${item.type.toUpperCase()}</strong></td>
                    <td>${formatDateDisplay(date)}</td>
                    <td>${details}</td>
                    <td>${timeIn}</td>
                    <td>${timeOut}</td>
                    <td class="${statusClass}">${statusText}</td>
                </tr>`;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
            resultsDiv.style.display = 'block';
        }

        function clearFilters() {
            document.getElementById('historyDept').value = 'all';
            document.getElementById('historyStatus').value = 'all';
            document.getElementById('historyFromTime').value = '00:00';
            document.getElementById('historyToTime').value = '23:59';
            
            const today = new Date();
            document.getElementById('historyFromDate').value = formatDate(today);
            document.getElementById('historyToDate').value = formatDate(today);
            
            document.getElementById('historyResults').style.display = 'none';
            document.getElementById('statsCards').style.display = 'none';
            document.getElementById('filterTags').innerHTML = '';
            currentSearchResults = [];
        }

        // Export to Excel
        function exportToExcelFile() {
            if (currentSearchResults.length === 0) {
                alert('No data to export. Please search first.');
                return;
            }
            
            exportHistoryToExcel(
                currentSearchResults, 
                currentFilters.fromDate, 
                currentFilters.toDate
            );
        }

        // Export daily report
        function exportDailyReport() {
            exportDailyReportToExcel();
        }

        // Print report
        function printHistoryResults() {
            const container = document.getElementById('historyResultsContainer');
            const printWindow = window.open('', '_blank');
            
            printWindow.document.write(`
                <html>
                <head>
                    <title>History Report</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 20px; }
                        h1 { color: #2c3e50; text-align: center; }
                        h2 { color: #7f8c8d; text-align: center; font-size: 14px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
                        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                        th { background: #2c3e50; color: white; }
                        tr:nth-child(even) { background: #f9f9f9; }
                        .status-in { color: #27ae60; font-weight: bold; }
                        .status-out { color: #e74c3c; font-weight: bold; }
                        .status-pending { color: #f39c12; font-weight: bold; }
                    </style>
                </head>
                <body>
                    <h1>🚛 Gate Management System</h1>
                    <h2>History Report - ${currentFilters.fromDate} to ${currentFilters.toDate}</h2>
                    ${container.innerHTML}
                    <script>window.print();<\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        }
    </script>
</body>
</html>
