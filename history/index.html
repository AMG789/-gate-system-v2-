<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History - Facility Management System</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/assets/css/main.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <i class="fas fa-building"></i>
        </div>
        <span class="sidebar-title">Facility MS</span>
      </div>
      
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Main</div>
          <a href="/dashboard/" class="nav-link">
            <i class="fas fa-home"></i>
            <span>Dashboard</span>
          </a>
        </div>
        
        <div class="nav-section">
          <div class="nav-section-title">Management</div>
          <a href="/fcp/" class="nav-link">
            <i class="fas fa-clipboard-check"></i>
            <span>FCP</span>
          </a>
          <a href="/fnq/" class="nav-link">
            <i class="fas fa-tasks"></i>
            <span>FNQ</span>
          </a>
          <a href="/visitors/" class="nav-link">
            <i class="fas fa-users"></i>
            <span>Visitors</span>
          </a>
          <a href="/gatepass/" class="nav-link">
            <i class="fas fa-id-card"></i>
            <span>Gate Pass</span>
          </a>
        </div>
        
        <div class="nav-section">
          <div class="nav-section-title">Records</div>
          <a href="/history/" class="nav-link active">
            <i class="fas fa-history"></i>
            <span>History</span>
          </a>
          <a href="/users/" class="nav-link" data-role="admin,manager">
            <i class="fas fa-user-cog"></i>
            <span>Users</span>
          </a>
        </div>
      </nav>
      
      <div class="sidebar-footer">
        <a href="#" class="nav-link" id="sidebar-logout">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </a>
      </div>
    </aside>
    
    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <button class="header-toggle" id="sidebar-toggle">
            <i class="fas fa-bars"></i>
          </button>
          <h2 class="header-title">Activity History</h2>
        </div>
        
        <div class="header-right">
          <div class="header-btn" id="notification-btn">
            <i class="fas fa-bell"></i>
            <span class="notification-badge"></span>
          </div>
          
          <div class="user-menu-wrapper">
            <button class="user-menu-toggle" id="user-menu-toggle">
              <div class="user-avatar" id="user-avatar">U</div>
              <div class="user-info">
                <div class="user-name" id="user-name">User</div>
                <div class="user-role" id="user-role-badge">User</div>
              </div>
              <i class="fas fa-chevron-down" style="font-size: 0.75rem; color: var(--text-secondary);"></i>
            </button>
            
            <div class="user-menu" id="user-menu">
              <a href="#" class="user-menu-item">
                <i class="fas fa-user"></i>
                <span>Profile</span>
              </a>
              <a href="#" class="user-menu-item">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
              </a>
              <div class="user-menu-divider"></div>
              <a href="#" class="user-menu-item" id="logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
              </a>
            </div>
          </div>
        </div>
      </header>
      
      <!-- Page Content -->
      <div class="page-content">
        <!-- Page Header -->
        <div class="page-header">
          <div>
            <h1 class="page-title">Activity History</h1>
            <p class="page-subtitle">View and track all system activities</p>
          </div>
        </div>
        
        <!-- Filters -->
        <div class="card" style="margin-bottom: 1.5rem;">
          <div class="card-body">
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
              <div style="flex: 1; min-width: 200px;">
                <input type="text" class="form-input" id="search-activity" placeholder="Search activity...">
              </div>
              <div style="min-width: 150px;">
                <select class="form-input" id="module-filter">
                  <option value="">All Modules</option>
                  <option value="visitors">Visitors</option>
                  <option value="gatepass">Gate Pass</option>
                  <option value="fcp">FCP</option>
                  <option value="fnq">FNQ</option>
                  <option value="users">Users</option>
                </select>
              </div>
              <div style="min-width: 150px;">
                <select class="form-input" id="action-filter">
                  <option value="">All Actions</option>
                  <option value="create">Create</option>
                  <option value="update">Update</option>
                  <option value="delete">Delete</option>
                  <option value="login">Login</option>
                  <option value="logout">Logout</option>
                </select>
              </div>
              <div style="min-width: 150px;">
                <input type="date" class="form-input" id="date-filter">
              </div>
              <button class="btn btn-secondary" id="filter-btn">
                <i class="fas fa-filter"></i>
                <span>Filter</span>
              </button>
            </div>
          </div>
        </div>
        
        <!-- Activity Timeline -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Activity Log</h3>
            <div style="display: flex; gap: 0.5rem;">
              <button class="btn btn-sm btn-secondary" id="export-btn">
                <i class="fas fa-download"></i>
                <span>Export</span>
              </button>
              <button class="btn btn-sm btn-danger" id="clear-btn" data-role="admin">
                <i class="fas fa-trash"></i>
                <span>Clear Old</span>
              </button>
            </div>
          </div>
          <div class="card-body">
            <div id="activity-timeline">
              <div class="loading-spinner" style="width: 30px; height: 30px;"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Firebase Config -->
  <script src="/assets/js/firebase-config.js"></script>
  
  <!-- Auth Guard -->
  <script src="/assets/js/auth-guard.js"></script>
  
  <!-- Role Guard -->
  <script src="/assets/js/role-guard.js"></script>
  
  <!-- Main JS -->
  <script src="/assets/js/main.js"></script>
  
  <script>
    (function() {
      'use strict';
      
      // Update user info
      function updateUserInfo(user) {
        if (!user) return;
        
        const userName = document.getElementById('user-name');
        const userAvatar = document.getElementById('user-avatar');
        
        if (userName) {
          userName.textContent = user.displayName || user.email.split('@')[0];
        }
        
        if (userAvatar) {
          const initial = (user.displayName || user.email).charAt(0).toUpperCase();
          userAvatar.textContent = initial;
        }
      }
      
      // Load activity history
      async function loadActivityHistory() {
        const container = document.getElementById('activity-timeline');
        
        try {
          const db = firebase.firestore();
          const snapshot = await db.collection('activity')
            .orderBy('timestamp', 'desc')
            .limit(100)
            .get();
          
          if (snapshot.empty) {
            container.innerHTML = `
              <div style="text-align: center; padding: 3rem; color: var(--text-secondary);">
                <i class="fas fa-history" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;"></i>
                <p>No activity records found</p>
              </div>
            `;
            return;
          }
          
          let currentDate = '';
          let html = '<div style="display: flex; flex-direction: column; gap: 1.5rem;">';
          
          snapshot.docs.forEach(doc => {
            const data = doc.data();
            const timestamp = data.timestamp ? data.timestamp.toDate() : new Date();
            const date = timestamp.toLocaleDateString();
            const time = timestamp.toLocaleTimeString();
            
            // Add date header if new date
            if (date !== currentDate) {
              currentDate = date;
              html += `
                <div style="display: flex; align-items: center; gap: 1rem; margin-top: 1rem;">
                  <div style="font-weight: 600; color: var(--text-secondary); font-size: 0.875rem;">${date}</div>
                  <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
                </div>
              `;
            }
            
            // Determine icon based on action
            let icon = 'fa-circle';
            let iconColor = 'var(--primary-color)';
            
            switch (data.action) {
              case 'create':
                icon = 'fa-plus-circle';
                iconColor = 'var(--success-color)';
                break;
              case 'update':
                icon = 'fa-edit';
                iconColor = 'var(--primary-color)';
                break;
              case 'delete':
                icon = 'fa-trash';
                iconColor = 'var(--danger-color)';
                break;
              case 'login':
                icon = 'fa-sign-in-alt';
                iconColor = 'var(--info-color)';
                break;
              case 'logout':
                icon = 'fa-sign-out-alt';
                iconColor = 'var(--secondary-color)';
                break;
            }
            
            html += `
              <div style="display: flex; gap: 1rem; padding: 1rem; background: var(--bg-secondary); border-radius: var(--radius-md);">
                <div style="width: 40px; height: 40px; background: ${iconColor}20; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                  <i class="fas ${icon}" style="color: ${iconColor};"></i>
                </div>
                <div style="flex: 1;">
                  <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                      <div style="font-weight: 600;">${data.description || data.activity || 'Unknown activity'}</div>
                      <div style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">
                        <span style="text-transform: capitalize;">${data.module || 'System'}</span> • 
                        By ${data.user || 'System'} • 
                        <span style="text-transform: capitalize;">${data.action || 'action'}</span>
                      </div>
                    </div>
                    <div style="font-size: 0.75rem; color: var(--text-light); white-space: nowrap;">${time}</div>
                  </div>
                  ${data.details ? `<div style="margin-top: 0.5rem; font-size: 0.875rem; color: var(--text-secondary);">${data.details}</div>` : ''}
                </div>
              </div>
            `;
          });
          
          html += '</div>';
          container.innerHTML = html;
          
        } catch (error) {
          console.error('Error loading activity:', error);
          
          // Show demo data
          container.innerHTML = `
            <div style="display: flex; flex-direction: column; gap: 1.5rem;">
              <div style="display: flex; align-items: center; gap: 1rem;">
                <div style="font-weight: 600; color: var(--text-secondary); font-size: 0.875rem;">Today</div>
                <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
              </div>
              
              <div style="display: flex; gap: 1rem; padding: 1rem; background: var(--bg-secondary); border-radius: var(--radius-md);">
                <div style="width: 40px; height: 40px; background: rgba(16, 185, 129, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                  <i class="fas fa-user-plus" style="color: var(--success-color);"></i>
                </div>
                <div style="flex: 1;">
                  <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                      <div style="font-weight: 600;">New visitor registered</div>
                      <div style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">Visitors • By John Smith • Create</div>
                    </div>
                    <div style="font-size: 0.75rem; color: var(--text-light);">09:30 AM</div>
                  </div>
                </div>
              </div>
              
              <div style="display: flex; gap: 1rem; padding: 1rem; background: var(--bg-secondary); border-radius: var(--radius-md);">
                <div style="width: 40px; height: 40px; background: rgba(37, 99, 235, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                  <i class="fas fa-id-card" style="color: var(--primary-color);"></i>
                </div>
                <div style="flex: 1;">
                  <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                      <div style="font-weight: 600;">Gate pass created</div>
                      <div style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">Gate Pass • By Sarah Johnson • Create</div>
                    </div>
                    <div style="font-size: 0.75rem; color: var(--text-light);">09:15 AM</div>
                  </div>
                </div>
              </div>
              
              <div style="display: flex; gap: 1rem; padding: 1rem; background: var(--bg-secondary); border-radius: var(--radius-md);">
                <div style="width: 40px; height: 40px; background: rgba(6, 182, 212, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                  <i class="fas fa-sign-in-alt" style="color: var(--info-color);"></i>
                </div>
                <div style="flex: 1;">
                  <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                      <div style="font-weight: 600;">User logged in</div>
                      <div style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">System • By Mike Wilson • Login</div>
                    </div>
                    <div style="font-size: 0.75rem; color: var(--text-light);">08:45 AM</div>
                  </div>
                </div>
              </div>
              
              <div style="display: flex; align-items: center; gap: 1rem; margin-top: 1rem;">
                <div style="font-weight: 600; color: var(--text-secondary); font-size: 0.875rem;">Yesterday</div>
                <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
              </div>
              
              <div style="display: flex; gap: 1rem; padding: 1rem; background: var(--bg-secondary); border-radius: var(--radius-md);">
                <div style="width: 40px; height: 40px; background: rgba(245, 158, 11, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                  <i class="fas fa-clipboard-check" style="color: var(--warning-color);"></i>
                </div>
                <div style="flex: 1;">
                  <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                      <div style="font-weight: 600;">FCP status updated</div>
                      <div style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">FCP • By Emily Brown • Update</div>
                    </div>
                    <div style="font-size: 0.75rem; color: var(--text-light);">05:30 PM</div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }
      }
      
      // Initialize
      document.addEventListener('auth:verified', (event) => {
        updateUserInfo(event.detail.user);
        loadActivityHistory();
      });
      
      // Demo mode fallback
      if (firebaseConfig.apiKey === 'YOUR_API_KEY') {
        const demoUser = JSON.parse(sessionStorage.getItem('demoUser') || '{}');
        if (demoUser.email) {
          updateUserInfo(demoUser);
          loadActivityHistory();
        }
      }
    })();
  </script>
</body>
</html>
